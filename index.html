"<div class='grid g2' style='margin-top:12px'>"+REGIONS.map(r=>{const e=S.ex[r.id],lock=S.realm<r.req,f=Math.min(1,e.p/r.goal);

"<div class='card' style='margin-top:12px'><h3>探索記錄</h3><div class='log'>"+(S.exlog.slice(0,40).map(l=>"<div>· "+esc(l.t)+"</div>").join("")||"<div>派出角色與靈寵，記錄會寫在這裏。</div>")+"</div></div>"}
function explore(rid,n){const r=RG(rid),e=S.ex[rid];let got={stone:0,shard:0,wood:0,iron:0,soul:0,exp:0};
for(let k=0;k<n&&S.ap>0;k++){S.ap--;const pw=power(),ep=r.base+e.p*Math.max(2,r.base*.06);
const roll=Math.random();
if(roll<.56){const en=pick(r.en);if(pw*rnd(.82,1.25)>=ep){e.p++;S.st.wins++;const st=Math.round(rnd(8,20)+r.base*.5),sh=Math.round((rnd(2,6)+r.base*.08)*shardMul());got.stone+=st;got.shard+=sh;got.exp+=Math.round(r.base*.12);S.exlog.unshift({t:"【"+r.n+"】擊退 "+en+"：靈石 +"+st+"、碎片 +"+sh})}
else S.exlog.unshift({t:"【"+r.n+"】"+en+" 攔路未果。需調整配裝或稍後再來，無任何損失。"})}
else if(roll<.82){e.p++;const fi=pick(r.fi),g=pick(["wood","iron"]);const q=ri(1,3);got[g]+=q;got.stone+=Math.round(rnd(5,14)+r.base*.3);S.exlog.unshift({t:"【"+r.n+"】拾得 "+fi+"："+(g==="wood"?"靈木":"玄鐵")+" +"+q,p:1})}
else{e.p++;if(Math.random()<.45){S.soul++;got.soul++;S.exlog.unshift({t:"【"+r.n+"】開啟靈匣：獸魂玉 +1",p:1})}else{const sh=Math.round((rnd(6,14)+r.base*.12)*shardMul());got.shard+=sh;S.exlog.unshift({t:"【"+r.n+"】開啟靈匣：法器碎片 +"+sh})}}
const p=eqP();if(p&&Math.random()<.3)S.exlog.unshift({t:"〔"+(S.pt[p.id].name||P(p.id).n)+"〕"+pick(["在"+r.n+"替你記下了路線。","叼回一片不知名的葉子。","在石上蹭了蹭，像在說這邊安全。","學會辨認一個新的符號。"]),p:1});
r.ch.forEach(c=>{if(e.p===c.p)S.exlog.unshift({t:"❖ 章節 ‧ "+r.n+"："+c.t})});
if(e.p>r.goal)e.p=r.goal}
S.stone+=got.stone;S.shard+=got.shard;S.wood+=got.wood;S.iron+=got.iron;S.exp+=got.exp;
if(S.exlog.length>400)S.exlog.length=400;checkAch();save();
toast("探索結算：靈石 +"+got.stone+"　碎片 +"+got.shard+(got.exp?"　修為 +"+got.exp:""));render()}
function boss(rid){const r=RG(rid),e=S.ex[rid];S.ap-=3;
if(power()*rnd(.85,1.3)>=r.bp){e.cl=true;S.decor.push({g:r.rw.g,n:r.rw.n,from:"通關 "+r.n,t:now()});S.stone+=r.base*6;S.shard+=r.base;S.soul+=2;S.exp+=Math.round(r.base*1.5);
S.exlog.unshift({t:"★ 通關 "+r.n+"：擊退 "+r.bz+"，獲裝飾「"+r.rw.n+"」"});
modal("<h3>秘境通關 ‧ "+r.n+"</h3><p class='quote'>"+r.ch[r.ch.length-1].t+"</p><div class='sep'></div><p class='d'>獲得：裝飾「"+r.rw.n+"」、靈石 "+r.base*6+"、碎片 "+r.base+"、獸魂玉 2、修為 "+Math.round(r.base*1.5)+"。<br>舊秘境仍可重複探索取材，不會失去價值。</p><div class='row'><button class='btn p' data-a='close'>收下</button></div>");

function itcard(w,k,mini){const lv=w.lv||1,up=upCost(w,lv);

function pasName(p,lv){const v=(p.v*(1+(lv-1)*.1)*100).toFixed(1)+"%";return{exp:"修為 +"+v,stone:"靈石 +"+v,shard:"碎片 +"+v,ap:"行動點 +"+v,bond:"羈絆 +"+v,atk:"戰力 +"+v}[p.t]}

for(let i=0;i<n;i++){S.pity++;S.st.draws++;let r;const soft=(S.st.draws%10===0);

function pdraw(n){if(S.soul<n)return;S.soul-=n;const got=[];

const p=pick(PETS.filter(q=>q.r===r));
if(S.pt[p.id]){S.pt[p.id].bond=Math.min(200,(S.pt[p.id].bond||0)+25);got.push({p,dup:1})}else{S.pt[p.id]={bond:10,evo:null,name:null};if(!S.eqP)S.eqP=p.id;got.push({p,dup:0})}}

modal("<h3>契靈所得</h3><div class='grid g4'>"+got.map(g=>"<div class='it r"+g.p.r+"'><div class='gl'>"+g.p.g+"</div><b>"+g.p.n+"</b><small class='rr"+g.p.r+"'>"+g.p.r+"★ "+BR[g.p.b].n+"</small><small>"+(g.dup?"重複 → 羈絆 +25":"新締契約")+"</small></div>").join("")+"</div><div class='sep'></div><p class='quote'>「"+got[0].p.l+"」</p><div class='row'><button class='btn p' data-a='close'>收下</button></div>");render()}

/* ---------- 計時 ---------- */
function startTimer(id){const t=S.tasks.find(x=>x.id===id);if(!t||isDone(t))return;S.timer={id:id,start:now(),dur:(t.min||25)*6e4,acc:0,pz:0};save();tloop()}
let TI=null;
function tloop(){const ov=document.getElementById("tov");if(!S.timer){ov.classList.remove("on");clearInterval(TI);TI=null;return}
ov.classList.add("on");if(!TI)TI=setInterval(tloop,250);
const T=S.timer,t=S.tasks.find(x=>x.id===T.id);if(!t){S.timer=null;return tloop()}
const el=T.pz?T.acc:T.acc+(now()-T.start),left=Math.max(0,T.dur-el),f=cl(el/T.dur,0,1);
const m=Math.floor(left/6e4),s=Math.floor(left%6e4/1000);
document.getElementById("ring").innerHTML="<svg width='230' height='230'><circle cx='115' cy='115' r='100' stroke='rgba(255,255,255,.08)' stroke-width='10' fill='none'/><circle cx='115' cy='115' r='100' stroke='url(#g)' stroke-width='10' fill='none' stroke-linecap='round' stroke-dasharray='"+(628*f)+" 628'/><defs><linearGradient id='g'><stop offset='0' stop-color='#8a6b2a'/><stop offset='1' stop-color='#f3e0a8'/></linearGradient></defs></svg><div><b>"+m+":"+String(s).padStart(2,"0")+"</b><span style='font-size:12px;color:#93a3b5;letter-spacing:2px;margin-top:6px'>"+esc(t.name)+"</span></div>";
document.getElementById("tinfo").textContent=(T.pz?"已暫停　":"")+"已完成 "+Math.round(f*100)+"%　"+TIERS[t.tier].n+" ‧ "+BR[t.br].n;
if(left<=0)endTimer()}
/* 結算：ratio=實際經過/預計；記錄分鐘=實際經過分鐘（不再二次折算） */
function endTimer(){const T=S.timer;if(!T)return;const t=S.tasks.find(x=>x.id===T.id);const el=Math.min(T.dur,T.pz?T.acc:T.acc+(now()-T.start)),r=cl(el/T.dur,0,1);
S.timer=null;clearInterval(TI);TI=null;document.getElementById("tov").classList.remove("on");
if(!t){save();return render()}
if(r<.2){toast("已停止。未達兩成，不結算，也不扣修為。");save();return render()}
doTask(t,r,Math.max(1,Math.round(el/6e4)))}

tab:v=>{S.ui.tab=v;save();render();window.scrollTo(0,0);document.querySelector("main").scrollTop=0},

preset:v=>{const p=PRESETS[+v];S.tasks.unshift({id:tid(),name:p.name,type:p.type,tier:p.tier,br:p.br,min:p.min,rep:p.rep,steps:[],done:false,last:null});save();toast("已加入："+p.name);render()},
add:()=>{const n=document.getElementById("f_n").value.trim();if(!n)return toast("請先寫下任務名稱");

del:v=>{S.tasks=S.tasks.filter(t=>t.id!==v);save();render()},

fin:v=>{const t=S.tasks.find(x=>x.id===v);if(t&&!isDone(t))doTask(t,1)},

const sub={id:t.id,name:t.name+" ‧ "+t.steps[+i].t,type:"result",tier:Math.max(1,t.tier-2),br:t.br,min:Math.max(1,Math.round((t.min||30)/t.steps.length)),rep:"none"};
doTask(sub,1,sub.min,true);
if(t.steps.every(s=>s.done))doTask(t,1,0)},
demon:v=>{const d=DEMONS[+v];document.getElementById("dmo").innerHTML="<div class='task'><p class='quote'>"+d.s+"</p><div class='row' style='margin-top:9px'><button class='btn p' data-a='dadd' data-v='"+v+"'>加入今日修行（微修 "+d.m+" 分）</button></div></div>"},
dadd:v=>{const d=DEMONS[+v];S.tasks.unshift({id:tid(),name:d.t,type:"focus",tier:1,br:"vital",min:d.m,rep:"none",steps:[],done:false,last:null});save();toast("已加入："+d.t);render()},
vowset:v=>{const o=vopts()[+v];if(!o)return;S.vow={k:o.k,arg:o.arg,goal:o.goal,p:0,d:o.d};S.vopt=null;save();toast("已立願，不限期、不會失敗");render()},
vowdrop:()=>{S.vow=null;S.vopt=null;save();render()},
bt:()=>{const r=REALMS[S.realm];if(S.exp<r.need||!S.vow||S.vow.p<S.vow.goal)return;
S.exp-=r.need;S.realm++;S.vow=null;S.vopt=null;S.stone+=200+S.realm*120;S.shard+=40+S.realm*20;S.soul+=1;S.ap=cl(S.ap+6,0,30);
if(S.realm===7)S.sect={i:0,p:0,np:{},done:0,on:now()};
checkAch();save();
const nr=REALMS[S.realm];
modal("<h3>渡劫 ‧ 已入「"+nr.n+"」境</h3><p class='quote'>你不是因為運氣好而突破，是因為你真的做了那些事。</p><div class='sep'></div><p class='d'>本境所得："+nr.u+"<br>獲得靈石、碎片與獸魂玉。<br>可刻下一道銘文，記住這一刻。</p><div><label>銘文內容（可留空）</label><input id='ins' value='突破至"+nr.n+"境'></div><div class='row' style='margin-top:10px'><button class='btn p' data-a='inssave'>刻下</button><button class='btn' data-a='close'>之後再說</button></div>");render()},
insc:()=>modal("<h3>刻下銘文</h3><p class='d'>寫下一件你真正完成的事。它只屬於你。</p><div><label>銘文內容</label><input id='ins' placeholder='例：第一次完成整本日文教材'></div><div class='row' style='margin-top:10px'><button class='btn p' data-a='inssave'>刻下</button><button class='btn' data-a='close'>取消</button></div>"),
inssave:()=>{const e=document.getElementById("ins");if(!e)return closeM();const t=e.value.trim().slice(0,60);const slots=1+Math.floor(S.realm/3);
if(t&&S.fate.length<slots){S.fate.push({t:t,d:now()});checkAch();toast("銘文已刻："+t)}else if(t&&S.fate.length>=slots)toast("銘文位已滿，提升境界可增加");
save();closeM();render()},
farm:()=>{if(!S.cv.tian||S.farm<1)return;S.stone+=S.cv.tian*8*S.farm;S.wood+=S.cv.tian*2*S.farm;toast("靈田收成：靈石 +"+S.cv.tian*8*S.farm+"　靈木 +"+S.cv.tian*2*S.farm);S.farm=0;save();render()},
room:v=>{const r=ROOMS.find(x=>x.id===v),lv=S.cv[v],c=roomCost(v,lv);if(roomLock(v)||lv>=r.max)return;
if(S.stone<c.stone||S.wood<c.wood||S.iron<c.iron)return toast("材料不足：需靈石 "+c.stone+"、靈木 "+c.wood+"、玄鐵 "+c.iron);
S.stone-=c.stone;S.wood-=c.wood;S.iron-=c.iron;S.cv[v]++;if(v==="tian"&&lv===0)S.farm=0;save();toast(r.n+" 已至 Lv"+S.cv[v]);render()},
exp:v=>{const[id,n]=v.split("|");explore(id,+n)},
boss:v=>boss(v),
draw:v=>draw(+v),
pdraw:v=>pdraw(+v),
weq:v=>{S.eqW=v;save();toast("已佩帶 "+W(v).n);render()},
wup:v=>{const o=S.wp[v],w=W(v),c=upCost(w,o.lv);if(o.lv>=10||S.shard<c)return;S.shard-=c;o.lv++;save();toast(w.n+" → Lv"+o.lv);render()},
craft:v=>{const w=W(v),c=craftCost(w);if(S.shard<c.s||S.iron<c.i)return;S.shard-=c.s;S.iron-=c.i;
if(S.wp[v]){const sh=w.r===5?120:w.r===4?45:12;S.shard+=sh;toast("再造 "+w.n+"：重複轉為碎片 +"+sh)}else{S.wp[v]={lv:1};if(!S.eqW)S.eqW=v;toast("打造成功："+w.n)}
checkAch();save();render()},
peq:v=>{S.eqP=v;save();toast("已帶上 "+(S.pt[v].name||P(v).n));render()},
rename:()=>{const p=eqP();if(!p)return;modal("<h3>為靈寵改名</h3><div><label>名字</label><input id='pn' value='"+esc(p.name||P(p.id).n)+"'></div><div class='row' style='margin-top:10px'><button class='btn p' data-a='rnsave'>確定</button><button class='btn' data-a='close'>取消</button></div>")},
rnsave:()=>{const p=eqP(),e=document.getElementById("pn");if(p&&e&&e.value.trim())S.pt[p.id].name=e.value.trim().slice(0,8);save();closeM();render()},
evo:()=>{const p=eqP();if(!p)return;const b=P(p.id);
modal("<h3>選擇進化分支 ‧ "+esc(p.name||b.n)+"</h3><p class='d'>同一隻靈寵可以走向不同方向。選定後便是牠獨有的樣子。</p><div class='grid g3'>"+b.evo.map((e,i)=>"<div class='it'><div class='gl'>"+b.g+"</div><b>"+e.n+"</b><small>"+e.d+"</small><button class='btn s' style='margin-top:7px' data-a='evosave' data-v='"+i+"'>選擇</button></div>").join("")+"</div>")},
evosave:v=>{const p=eqP();if(!p)return;S.pt[p.id].evo=+v;save();closeM();toast("進化完成："+P(p.id).evo[+v].n);render()},
export:()=>modal("<h3>匯出存檔</h3><p class='d'>複製以下文字妥善保存。舊版存檔同樣可匯入，會自動升級並保留全部紀錄。</p><textarea rows='8' readonly onclick='this.select()'>"+esc(JSON.stringify(S))+"</textarea><div class='row' style='margin-top:10px'><button class='btn p' data-a='close'>關閉</button></div>"),
import:()=>modal("<h3>匯入存檔</h3><p class='d'>貼上存檔文字，將覆蓋目前進度。舊版存檔會自動升級。</p><textarea id='imp' rows='8'></textarea><div class='row' style='margin-top:10px'><button class='btn p' data-a='impsave'>匯入</button><button class='btn' data-a='close'>取消</button></div>"),
impsave:()=>{try{const o=JSON.parse(document.getElementById("imp").value);if(!o||typeof o!=="object")throw 0;S=migrate(o);save();closeM();toast("已匯入");render()}catch(e){toast("格式有誤")}},
reset:()=>modal("<h3>重置修行</h3><p class='d'>將清除所有進度，無法復原。確定嗎？</p><div class='row'><button class='btn' data-a='resetyes'>確定重置</button><button class='btn p' data-a='close'>取消</button></div>"),
resetyes:()=>{S=fresh();save();closeM();toast("已重置");render()},
sect:()=>{if(S.realm<7)return;const pj=sectProj();if(S.sect.p<pj.goal)return;S.decor.push({g:pj.r.g,n:pj.r.n,from:"共修 "+pj.n,t:now()});S.sect.i++;S.sect.p=0;S.sect.np={};S.sect.done++;S.stone+=500;checkAch();save();
modal("<h3>工程落成 ‧ "+pj.n+"</h3><p class='quote'>沒有人被公開比較，也沒有人因缺席被罰。你們只是各自做完了自己的事。</p><div class='sep'></div><p class='d'>獲得裝飾「"+pj.r.n+"」與靈石 500，新工程已開啟。</p><div class='row'><button class='btn p' data-a='close'>好</button></div>");render()},
tpause:()=>{const T=S.timer;if(!T)return;if(T.pz){T.start=now();T.pz=0}else{T.acc+=now()-T.start;T.pz=1}save();tloop()},
tdone:()=>endTimer(),
tcancel:()=>{S.timer=null;clearInterval(TI);TI=null;document.getElementById("tov").classList.remove("on");toast("已放棄，不扣修為");save();render()}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;if(ACT[a])ACT[a](b.dataset.v,b)});
document.getElementById("ov").addEventListener("click",e=>{if(e.target.id==="ov")closeM()});
/* ---------- 渲染 ---------- */
function render(){dayTick();S.seen=now();if(archiveTasks())save();sidebar();const v={today:vToday,char:vChar,cave:vCave,pets:vPets,world:vWorld,treasure:vTre,journal:vJour}[S.ui.tab]||vToday;document.getElementById("view").innerHTML=v()}
/* ---------- 背景美術 ---------- */
const cv=document.getElementById("bg"),cx=cv.getContext("2d");let mo=[],W0=0,H0=0;
function resize(){W0=cv.width=innerWidth;H0=cv.height=innerHeight;mo=[];for(let i=0;i<(W0<860?40:70);i++)mo.push({x:Math.random()*W0,y:Math.random()*H0,r:rnd(.6,2.1),s:rnd(.08,.4),o:rnd(.15,.7),p:Math.random()*6.28})}
function mnt(y,h,c,o){cx.globalAlpha=o;cx.fillStyle=c;cx.beginPath();cx.moveTo(0,H0);let x=0;while(x<W0+60){const hh=h*(.55+.45*Math.sin(x*.0023+y));cx.lineTo(x,H0-y-hh);x+=60}cx.lineTo(W0,H0);cx.closePath();cx.fill();cx.globalAlpha=1}
function bgLoop(t){cx.clearRect(0,0,W0,H0);const g=cx.createLinearGradient(0,0,0,H0);g.addColorStop(0,"#070b11");g.addColorStop(.45,"#0c1420");g.addColorStop(1,"#131a1d");cx.fillStyle=g;cx.fillRect(0,0,W0,H0);
cx.globalAlpha=.5;const mg=cx.createRadialGradient(W0*.78,H0*.17,4,W0*.78,H0*.17,120);mg.addColorStop(0,"rgba(243,224,168,.9)");mg.addColorStop(1,"rgba(243,224,168,0)");cx.fillStyle=mg;cx.beginPath();cx.arc(W0*.78,H0*.17,120,0,6.3);cx.fill();cx.globalAlpha=1;
mnt(40,H0*.3,"#0f1a22",.85);mnt(110,H0*.36,"#0b1319",.8);mnt(190,H0*.42,"#070d12",.75);
mo.forEach(m=>{m.y-=m.s;m.x+=Math.sin(t/2600+m.p)*.22;if(m.y<-6){m.y=H0+6;m.x=Math.random()*W0}cx.globalAlpha=m.o*(.55+.45*Math.sin(t/900+m.p));cx.fillStyle="#f3e0a8";cx.beginPath();cx.arc(m.x,m.y,m.r,0,6.3);cx.fill()});cx.globalAlpha=1;requestAnimationFrame(bgLoop)}
addEventListener("resize",resize);resize();requestAnimationFrame(bgLoop);
/* ---------- 啟動 ---------- */
if(!load()){S=fresh();save();
setTimeout(()=>modal("<h3>塵間修仙錄</h3><p class='quote'>「你在現實中坐下來開始做事，這個世界就會亮起一寸。」</p><div class='sep'></div><p class='d'>· 在「今日修行」加入任務，自訂形式與難度。<br>· 專注計時中斷亦按比例結算，<b>不扣修為、不設連續簽到</b>。<br>· 修為足夠後，自選一項「突破之願」渡劫；不抽成功率、不會失敗。<br>· 抽取機率公開、設保底、重複轉碎片、碎片可定向兌換。<br>· 忙碌時可開「閉關模式」；離開數週回來，只會被歡迎。</p><div class='row'><button class='btn p' data-a='close'>入道</button></div>"),400)}
if(S.timer)tloop();render();setInterval(save,3e4);
</script></body></html>
